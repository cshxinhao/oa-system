{% extends "base.html" %}

{% block title %}登录 - OA 系统{% endblock %}
{% block page_title %}登录{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    {% if form.errors %}
      <div class="alert alert-danger" role="alert">
        用户名或密码不正确，请重试。
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label for="id_username" class="form-label">用户名</label>
        <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control">
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">密码</label>
        <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
  </div>
</div>
{% endblock %}
