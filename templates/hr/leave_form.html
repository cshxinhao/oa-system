{% extends 'base.html' %}

{% block page_title %}新建请假申请{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="invalid-feedback d-block">
                    {{ field.errors }}
                </div>
                {% endif %}
                {% if field.help_text %}
                <div class="form-text">{{ field.help_text }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">提交申请</button>
            <a href="{% url 'hr:leave_list' %}" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
{% endblock %}
